name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The declared floor exactly (package.json "engines": >=22.12.0), plus
        # the current LTS lines. A bare "22" would resolve to the newest 22.x
        # and not test the floor at all.
        node-version: ["22.12.0", 22, 24]

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # typecheck is `tsc --noEmit`; build exercises the emit and the CLI
      # shim's chmod that the container image depends on.
      - run: npm run build
      - run: npm test
